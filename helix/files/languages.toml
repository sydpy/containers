# Additions to helix's default languages.toml, for the tools in the helix
# image. Helix merges this file into its defaults, and a project's
# .helix/languages.toml merges on top.
#
# Formatters take precedence over a language server's formatting. Helix
# runs them from the document's directory, with the buffer on stdin;
# %{buffer_name} lets prettier and shfmt find the project's configuration
# and infer the language. Rust, Python, C, C++ and TOML keep formatting
# through their servers: rustfmt, ruff, clang-format and taplo.
#
# language-servers replaces the default list, so each one below names only
# servers the image has, and `hx --health` reports no missing ones.

[[language]]
name = "python"
language-servers = ["ty", "ruff"]

[[language]]
name = "javascript"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "json"
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "jsonc"
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "css"
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "scss"
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "markdown"
language-servers = ["marksman"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "bash"
formatter = { command = "shfmt", args = ["--filename", "%{buffer_name}"] }

[[language]]
name = "toml"
language-servers = ["taplo"]

[[language]]
name = "cmake"
language-servers = ["neocmakelsp"]
