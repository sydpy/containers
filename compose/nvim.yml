services:
  nvim:
    # Built FROM localhost/base/dev; `make nvim` builds both. CT_USERNAME
    # must match the USERNAME the base images were built with, since it
    # names the home directory.
    build:
      context: ../nvim
    image: localhost/nvim:latest
    stdin_open: true
    tty: true
    init: true
    # The image's main user (UID 1000) runs as the host user, so it can write
    # to the project mounted on /workspace. Container root and every other UID
    # map to the host user's subordinate UIDs.
    userns_mode: keep-id:uid=1000,gid=1000
    # The host's nvim init.lua (options, keys, colors), read-only. It runs
    # after the image's setup in /etc/xdg/nvim and can override it. Only the
    # file, not ~/.config/nvim: there are no plugins in the image, and an
    # init.lua that loads plugins or modules from lua/ fails here. The file
    # must exist on the host, or podman refuses to start the container
    # (statfs: no such file or directory); an empty one will do.
    volumes:
      - ${HOME}/.config/nvim/init.lua:/home/${CT_USERNAME:-user}/.config/nvim/init.lua:ro
      - ${CT_WORKSPACE:-nvim_workspace}:/workspace

volumes:
  nvim_workspace:

# podman-compose puts the services in a pod by default, and podman refuses
# userns_mode for a container in a pod (--userns and --pod cannot be set
# together).
x-podman:
  in_pod: false
