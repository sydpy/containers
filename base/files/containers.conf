[containers]
cgroups = "disabled"
log_driver = "k8s-file"
# Inner containers share the outer container's UTS namespace. In a private
# one, crun sets the hostname, and podman's default seccomp profile only
# allows sethostname with CAP_SYS_ADMIN, which the outer container doesn't
# have: every inner container would fail with EPERM from sethostname.
utsns = "host"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
